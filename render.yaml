# render.yaml — Infrastructure as Code for Render.com
# Deploys: FastAPI backend (Docker) + PostgreSQL database + Persistent Disk for ChromaDB
#
# Usage:
# 1. Push this repo to GitHub
# 2. In Render Dashboard → New + → Blueprint → Connect repo
# 3. Render provisions all resources from this file
# 4. Add GEMINI_API_KEY in Render → Environment Variables (mark as secret)
# 5. Deploy

services:
  - type: web
    name: intellidesk-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Required: Set in Render Dashboard → Environment Variables (Secret)
      - key: GEMINI_API_KEY
        sync: false

      # Database URL — auto-populated from the PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: intellidesk-db
          property: connectionString

      # ChromaDB persistent storage path (mounted to persistent disk)
      - key: CHROMA_PATH
        value: /app/data/chroma_db

      # Upload directory for knowledge base files
      - key: UPLOAD_DIR
        value: /app/data/uploads

    # Persistent disk for ChromaDB vector store (survives deploys/restarts)
    disk:
      name: chroma-storage
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: intellidesk-db
    plan: free
    databaseName: intellidesk
    user: intellidesk
    region: oregon
    # Render manages connection pooling, SSL, backups automatically
    # Connection string format: postgresql://user:pass@host:port/dbname?sslmode=require